<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeOut — Платформа управления дизайном</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f17',
                        cardBg: '#131c2e',
                        borderCol: '#1e293b',
                        accent: '#6366f1',
                        accentHover: '#4f46e5'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f17; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col select-none">

    <div id="app" class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 bg-cardBg border-r border-borderCol flex flex-col transition-all duration-300 z-30">
            <div class="p-4 flex items-center justify-between border-b border-borderCol">
                <div id="sidebar-brand" class="flex items-center space-x-3 overflow-hidden">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-indigo-500/30 shrink-0">
                        W
                    </div>
                    <span class="font-bold text-lg tracking-wide whitespace-nowrap text-white">WeOut</span>
                </div>
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800/60 transition">
                    <i id="sidebar-toggle-icon" class="fa-solid fa-chevron-left"></i>
                </button>
            </div>

            <nav class="flex-1 p-3 space-y-1.5 overflow-y-auto">
                <button onclick="switchTab('dashboard')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition group" data-tab="dashboard">
                    <i class="fa-solid fa-chart-pie w-5 text-center text-lg"></i>
                    <span class="nav-text font-medium text-sm">Главная</span>
                </button>
                <button onclick="switchTab('crm')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition group" data-tab="crm">
                    <i class="fa-solid fa-users w-5 text-center text-lg"></i>
                    <span class="nav-text font-medium text-sm">Клиенты CRM</span>
                </button>
                <button onclick="switchTab('tasks')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition group" data-tab="tasks">
                    <i class="fa-solid fa-list-check w-5 text-center text-lg"></i>
                    <span class="nav-text font-medium text-sm">Задачи</span>
                </button>
                <button onclick="switchTab('finance')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition group" data-tab="finance">
                    <i class="fa-solid fa-wallet w-5 text-center text-lg"></i>
                    <span class="nav-text font-medium text-sm">Финансы</span>
                </button>
                <button onclick="switchTab('calculator')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition group" data-tab="calculator">
                    <i class="fa-solid fa-calculator w-5 text-center text-lg"></i>
                    <span class="nav-text font-medium text-sm">Калькулятор услуг</span>
                </button>
                <button onclick="switchTab('contracts')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition group" data-tab="contracts">
                    <i class="fa-solid fa-file-contract w-5 text-center text-lg"></i>
                    <span class="nav-text font-medium text-sm">Договоры</span>
                </button>
            </nav>

            <div class="p-3 border-t border-borderCol">
                <div class="flex items-center space-x-3 p-2 bg-slate-900/60 rounded-xl border border-slate-800/80">
                    <div class="w-9 h-9 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-sm shrink-0">
                        Х
                    </div>
                    <div class="nav-text overflow-hidden">
                        <div class="text-xs font-semibold text-white truncate">Хамражан</div>
                        <div class="text-[10px] text-slate-400 truncate">Дизайнер</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden bg-darkBg">
            <!-- TOPBAR -->
            <header class="h-16 bg-cardBg border-b border-borderCol px-6 flex items-center justify-between z-20">
                <div class="flex items-center space-x-4">
                    <h1 id="page-title" class="text-lg font-bold text-white tracking-wide">Главная</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <div id="weather-widget" class="hidden sm:flex items-center space-x-2 bg-slate-900/60 border border-borderCol px-3 py-1.5 rounded-xl text-xs text-slate-300">
                        <i class="fa-solid fa-cloud-sun text-amber-400 text-sm"></i>
                        <span>Алматы, +18°C</span>
                    </div>
                </div>
            </header>

            <!-- DYNAMIC TAB CONTENT -->
            <div id="content-area" class="flex-1 overflow-y-auto p-6">
                <!-- Контент рендерится через JS -->
            </div>
        </main>
    </div>

    <!-- SCRIPT LOGIC & STATE -->
    <script>
        // Инициализация данных в localStorage
        let state = {
            clients: JSON.parse(localStorage.getItem('weout_clients')) || [
                { id: 1, type: 'corporate', name: 'ТОО "Design Group"', contact: 'Алия С.', phone: '+7 701 111 2233', avatar: '' },
                { id: 2, type: 'individual', name: 'Тимурлан К.', contact: 'Тимурлан', phone: '+7 702 333 4455', avatar: '' }
            ],
            tasks: JSON.parse(localStorage.getItem('weout_tasks')) || [
                { id: 1, title: 'Рендер интерьера гостиной', client: 'Тимурлан К.', deadline: '2026-04-10', status: 'active', priority: 'Высокий', image: '' },
                { id: 2, title: 'Разработка брендбука TОО', client: 'ТОО "Design Group"', deadline: '2026-04-15', status: 'active', priority: 'Средний', image: '' }
            ],
            finances: JSON.parse(localStorage.getItem('weout_finances')) || [
                { id: 1, title: 'Предоплата за проект', amount: 150000, type: 'income', date: '2026-03-20' }
            ],
            contracts: JSON.parse(localStorage.getItem('weout_contracts')) || [
                { id: 1, name: 'Договор авторского надзора #12', client: 'Тимурлан К.', date: '2026-03-01' }
            ],
            calendarEvents: JSON.parse(localStorage.getItem('weout_events')) || [
                { id: 1, date: '2026-04-10', title: 'Сдача проекта: Рендер интерьера', type: 'task' },
                { id: 2, date: '2026-04-15', title: 'Встреча с ТОО "Design Group"', type: 'meeting' }
            ],
            calculatorSettings: JSON.parse(localStorage.getItem('weout_calc_settings')) || {
                basePriceSqm: 5000,
                basePriceHour: 15000
            }
        };

        function saveData() {
            localStorage.setItem('weout_clients', JSON.stringify(state.clients));
            localStorage.setItem('weout_tasks', JSON.stringify(state.tasks));
            localStorage.setItem('weout_finances', JSON.stringify(state.finances));
            localStorage.setItem('weout_contracts', JSON.stringify(state.contracts));
            localStorage.setItem('weout_events', JSON.stringify(state.calendarEvents));
            localStorage.setItem('weout_calc_settings', JSON.stringify(state.calculatorSettings));
        }

        let currentTab = 'dashboard';
        let sidebarCollapsed = false;

        function toggleSidebar() {
            sidebarCollapsed = !sidebarCollapsed;
            const sidebar = document.getElementById('sidebar');
            const brandText = document.getElementById('sidebar-brand').querySelector('span');
            const navTexts = document.querySelectorAll('.nav-text');
            const toggleIcon = document.getElementById('sidebar-toggle-icon');

            if (sidebarCollapsed) {
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-20');
                brandText.classList.add('hidden');
                navTexts.forEach(el => el.classList.add('hidden'));
                toggleIcon.classList.remove('fa-chevron-left');
                toggleIcon.classList.add('fa-chevron-right');
            } else {
                sidebar.classList.remove('w-20');
                sidebar.classList.add('w-64');
                brandText.classList.remove('hidden');
                navTexts.forEach(el => el.classList.remove('hidden'));
                toggleIcon.classList.remove('fa-chevron-right');
                toggleIcon.classList.add('fa-chevron-left');
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.dataset.tab === tab) {
                    btn.classList.add('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-600/30');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-600/30');
                    btn.classList.add('text-slate-400');
                }
            });

            const titles = {
                dashboard: 'Главная панель',
                crm: 'Клиентская база CRM',
                tasks: 'Управление задачами',
                finance: 'Финансовый учет',
                calculator: 'Калькулятор дизайн-услуг',
                contracts: 'Хранилище договоров'
            };
            document.getElementById('page-title').innerText = titles[tab] || 'Панель';
            renderContent();
        }

        function renderContent() {
            const area = document.getElementById('content-area');
            switch(currentTab) {
                case 'dashboard': area.innerHTML = renderDashboard(); break;
                case 'crm': area.innerHTML = renderCRM(); break;
                case 'tasks': area.innerHTML = renderTasks(); break;
                case 'finance': area.innerHTML = renderFinance(); break;
                case 'calculator': area.innerHTML = renderCalculator(); break;
                case 'contracts': area.innerHTML = renderContracts(); break;
            }
        }

        // --- ДАШБОРД С КАЛЕНДАРЕМ И ДАННЫМИ НА ПЕРВОМ МЕСТЕ ---
        function renderDashboard() {
            const activeTasks = state.tasks.filter(t => t.status === 'active').slice(0, 5);
            const topClients = state.clients.slice(0, 10);
            const totalIncome = state.finances.reduce((acc, f) => f.type === 'income' ? acc + Number(f.amount) : acc, 0);

            return `
                <div class="space-y-6">
                    <!-- Верхние метрики (Данные на первом месте) -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="bg-cardBg border border-borderCol p-5 rounded-2xl shadow-sm">
                            <div class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Всего клиентов</div>
                            <div class="text-2xl font-bold text-white mt-1">${state.clients.length}</div>
                        </div>
                        <div class="bg-cardBg border border-borderCol p-5 rounded-2xl shadow-sm">
                            <div class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Активные задачи</div>
                            <div class="text-2xl font-bold text-indigo-400 mt-1">${state.tasks.filter(t=>t.status==='active').length}</div>
                        </div>
                        <div class="bg-cardBg border border-borderCol p-5 rounded-2xl shadow-sm">
                            <div class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Доход за все время</div>
                            <div class="text-2xl font-bold text-emerald-400 mt-1">${totalIncome.toLocaleString()} ₸</div>
                        </div>
                        <div class="bg-cardBg border border-borderCol p-5 rounded-2xl shadow-sm">
                            <div class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Договоры</div>
                            <div class="text-2xl font-bold text-violet-400 mt-1">${state.contracts.length}</div>
                        </div>
                    </div>

                    <!-- Календарь событий и сроков -->
                    <div class="bg-cardBg border border-borderCol p-6 rounded-2xl">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-base font-bold text-white flex items-center space-x-2">
                                <i class="fa-solid fa-calendar-days text-indigo-400"></i>
                                <span>Календарь событий и сроков задач</span>
                            </h2>
                            <button onclick="openAddEventModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition">
                                <i class="fa-solid fa-plus mr-1"></i> Событие
                            </button>
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                            <div class="lg:col-span-2 bg-slate-900/50 p-4 rounded-xl border border-borderCol">
                                <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 mb-2">
                                    <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
                                </div>
                                <div class="grid grid-cols-7 gap-1.5 text-center text-sm">
                                    ${renderCalendarDays()}
                                </div>
                            </div>
                            <div class="bg-slate-900/50 p-4 rounded-xl border border-borderCol flex flex-col justify-between">
                                <div>
                                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Ближайшие события</h3>
                                    <div class="space-y-2.5 max-h-48 overflow-y-auto">
                                        ${state.calendarEvents.map(e => `
                                            <div class="p-2.5 bg-slate-800/60 rounded-xl border border-slate-700/60 text-xs flex justify-between items-center">
                                                <div>
                                                    <div class="font-semibold text-white">${e.title}</div>
                                                    <div class="text-slate-400 text-[10px] mt-0.5">${e.date}</div>
                                                </div>
                                                <button onclick="deleteEvent(${e.id})" class="text-slate-500 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Сетка: Активные задачи и 10 клиентов -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Активные задачи с картинками -->
                        <div class="bg-cardBg border border-borderCol p-6 rounded-2xl">
                            <h2 class="text-base font-bold text-white mb-4 flex items-center space-x-2">
                                <i class="fa-solid fa-list-check text-indigo-400"></i>
                                <span>Список активных задач</span>
                            </h2>
                            <div class="space-y-3">
                                ${activeTasks.length === 0 ? '<div class="text-xs text-slate-500">Нет активных задач</div>' : activeTasks.map(t => `
                                    <div class="flex items-center justify-between p-3 bg-slate-900/60 border border-borderCol rounded-xl">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-10 h-10 rounded-lg bg-slate-800 overflow-hidden shrink-0 border border-slate-700 flex items-center justify-center">
                                                ${t.image ? `<img src="${t.image}" class="w-full h-full object-cover">` : '<i class="fa-solid fa-image text-slate-600"></i>'}
                                            </div>
                                            <div>
                                                <div class="text-sm font-semibold text-white">${t.title}</div>
                                                <div class="text-xs text-slate-400">${t.client} • Дедлайн: ${t.deadline}</div>
                                            </div>
                                        </div>
                                        <span class="text-xs px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${t.priority}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- 10 клиентов с аватарами -->
                        <div class="bg-cardBg border border-borderCol p-6 rounded-2xl">
                            <h2 class="text-base font-bold text-white mb-4 flex items-center space-x-2">
                                <i class="fa-solid fa-users text-indigo-400"></i>
                                <span>Клиентская база (Топ 10)</span>
                            </h2>
                            <div class="space-y-3">
                                ${topClients.map(c => `
                                    <div class="flex items-center justify-between p-3 bg-slate-900/60 border border-borderCol rounded-xl">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-10 h-10 rounded-full bg-slate-800 overflow-hidden shrink-0 border border-slate-700 flex items-center justify-center">
                                                ${c.avatar ? `<img src="${c.avatar}" class="w-full h-full object-cover">` : '<span class="text-sm font-bold text-indigo-400">'+c.name[0]+'</span>'}
                                            </div>
                                            <div>
                                                <div class="text-sm font-semibold text-white">${c.name}</div>
                                                <div class="text-xs text-slate-400">${c.phone} (${c.type === 'corporate' ? 'Юр. лицо' : 'Физ. лицо'})</div>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCalendarDays() {
            let html = '';
            for (let i = 1; i <= 30; i++) {
                const dayStr = `2026-04-${i < 10 ? '0'+i : i}`;
                const hasEvent = state.calendarEvents.some(e => e.date === dayStr);
                html += `
                    <div class="p-2 rounded-xl border ${hasEvent ? 'bg-indigo-600/20 border-indigo-500 text-indigo-300 font-bold' : 'bg-slate-800/40 border-slate-800 text-slate-300'} text-xs">
                        ${i}
                    </div>
                `;
            }
            return html;
        }

        // --- CRM С ЗАГРУЗКОЙ АВАТАРОВ С КОМПЬЮТЕРА ---
        function renderCRM() {
            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-lg font-bold text-white">Управление клиентами</h2>
                        <button onclick="openClientModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition">
                            <i class="fa-solid fa-plus mr-1.5"></i> Добавить клиента
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${state.clients.map(c => `
                            <div class="bg-cardBg border border-borderCol p-5 rounded-2xl flex flex-col justify-between">
                                <div class="flex items-center space-x-4 mb-4">
                                    <div class="w-14 h-14 rounded-2xl bg-slate-800 overflow-hidden border border-slate-700 shrink-0 flex items-center justify-center">
                                        ${c.avatar ? `<img src="${c.avatar}" class="w-full h-full object-cover">` : '<span class="text-lg font-bold text-indigo-400">'+c.name[0]+'</span>'}
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-white">${c.name}</h3>
                                        <span class="text-[10px] px-2 py-0.5 rounded-md bg-slate-800 text-slate-400 border border-slate-700">${c.type === 'corporate' ? 'Корпоративный' : 'Частный'}</span>
                                    </div>
                                </div>
                                <div class="space-y-1.5 text-xs text-slate-400 mb-4 border-t border-borderCol pt-3">
                                    <div>Контакт: <span class="text-white">${c.contact}</span></div>
                                    <div>Телефон: <span class="text-white">${c.phone}</span></div>
                                </div>
                                <button onclick="deleteClient(${c.id})" class="text-red-400 hover:text-red-300 text-xs font-semibold self-end">Удалить</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- ЗАДАЧИ С КАРТИНКАМИ С ПК ---
        function renderTasks() {
            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-lg font-bold text-white">Список задач</h2>
                        <button onclick="openTaskModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition">
                            <i class="fa-solid fa-plus mr-1.5"></i> Новая задача
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${state.tasks.map(t => `
                            <div class="bg-cardBg border border-borderCol p-5 rounded-2xl flex space-x-4">
                                <div class="w-20 h-20 rounded-xl bg-slate-800 overflow-hidden shrink-0 border border-slate-700 flex items-center justify-center">
                                    ${t.image ? `<img src="${t.image}" class="w-full h-full object-cover">` : '<i class="fa-solid fa-image text-slate-600 text-xl"></i>'}
                                </div>
                                <div class="flex-1 flex flex-col justify-between">
                                    <div>
                                        <div class="flex justify-between items-start">
                                            <h3 class="font-bold text-white text-sm">${t.title}</h3>
                                            <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${t.priority}</span>
                                        </div>
                                        <div class="text-xs text-slate-400 mt-1">Клиент: ${t.client}</div>
                                        <div class="text-xs text-slate-500 mt-0.5">Срок: ${t.deadline}</div>
                                    </div>
                                    <div class="flex justify-end space-x-2 mt-2">
                                        <button onclick="deleteTask(${t.id})" class="text-red-400 hover:text-red-300 text-xs"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- ФИНАНСЫ ---
        function renderFinance() {
            const totalIncome = state.finances.reduce((acc, f) => f.type === 'income' ? acc + Number(f.amount) : acc, 0);
            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-lg font-bold text-white">Финансовый учет</h2>
                        <button onclick="openFinanceModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition">
                            <i class="fa-solid fa-plus mr-1.5"></i> Добавить операцию
                        </button>
                    </div>

                    <div class="bg-cardBg border border-borderCol p-6 rounded-2xl">
                        <div class="text-slate-400 text-xs uppercase font-semibold">Общий доход</div>
                        <div class="text-3xl font-bold text-emerald-400 mt-1">${totalIncome.toLocaleString()} ₸</div>
                    </div>

                    <div class="bg-cardBg border border-borderCol rounded-2xl overflow-hidden">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-900/60 text-slate-400 border-b border-borderCol">
                                <tr>
                                    <th class="p-4">Название</th>
                                    <th class="p-4">Сумма</th>
                                    <th class="p-4">Дата</th>
                                    <th class="p-4 text-right">Действие</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-borderCol">
                                ${state.finances.map(f => `
                                    <tr>
                                        <td class="p-4 font-semibold text-white">${f.title}</td>
                                        <td class="p-4 text-emerald-400 font-bold">+${Number(f.amount).toLocaleString()} ₸</td>
                                        <td class="p-4 text-slate-400">${f.date}</td>
                                        <td class="p-4 text-right">
                                            <button onclick="deleteFinance(${f.id})" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // --- РАСШИРЕННЫЙ КАЛЬКУЛЯТОР УСЛУГ С НАДБАВКАМИ И НАСТРОЙКОЙ ПОЛИТИКИ ---
        function renderCalculator() {
            return `
                <div class="space-y-6">
                    <h2 class="text-lg font-bold text-white">Калькулятор стоимости дизайн-услуг</h2>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- Настройка ценовой политики -->
                        <div class="bg-cardBg border border-borderCol p-6 rounded-2xl space-y-4">
                            <h3 class="font-bold text-white text-sm">Ценовая политика</h3>
                            <div>
                                <label class="text-xs text-slate-400 block mb-1">Базовая ставка за м² (₸)</label>
                                <input type="number" id="calc-sqm-price" value="${state.calculatorSettings.basePriceSqm}" onchange="updateCalcSettings()" class="w-full bg-slate-900 border border-borderCol rounded-xl px-3 py-2 text-xs text-white">
                            </div>
                            <div>
                                <label class="text-xs text-slate-400 block mb-1">Базовая ставка за час (₸)</label>
                                <input type="number" id="calc-hour-price" value="${state.calculatorSettings.basePriceHour}" onchange="updateCalcSettings()" class="w-full bg-slate-900 border border-borderCol rounded-xl px-3 py-2 text-xs text-white">
                            </div>
                        </div>

                        <!-- Расчет и фильтры надбавок -->
                        <div class="lg:col-span-2 bg-cardBg border border-borderCol p-6 rounded-2xl space-y-4">
                            <h3 class="font-bold text-white text-sm">Параметры проекта</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="text-xs text-slate-400 block mb-1">Площадь (м²)</label>
                                    <input type="number" id="calc-area" value="100" oninput="calculatePrice()" class="w-full bg-slate-900 border border-borderCol rounded-xl px-3 py-2 text-xs text-white">
                                </div>
                                <div>
                                    <label class="text-xs text-slate-400 block mb-1">Часы разработки</label>
                                    <input type="number" id="calc-hours" value="20" oninput="calculatePrice()" class="w-full bg-slate-900 border border-borderCol rounded-xl px-3 py-2 text-xs text-white">
                                </div>
                            </div>

                            <div class="space-y-2 pt-2 border-t border-borderCol">
                                <label class="text-xs font-semibold text-slate-400 block">Дополнительные опции:</label>
                                <label class="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
                                    <input type="checkbox" id="opt-supervision" onchange="calculatePrice()" class="rounded bg-slate-900 border-borderCol text-indigo-600">
                                    <span>Авторский надзор (+200,000 ₸)</span>
                                </label>
                                <label class="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
                                    <input type="checkbox" id="opt-urgent" onchange="calculatePrice()" class="rounded bg-slate-900 border-borderCol text-indigo-600">
                                    <span>Срочное выполнение (+25%)</span>
                                </label>
                                <label class="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
                                    <input type="checkbox" id="opt-support" onchange="calculatePrice()" class="rounded bg-slate-900 border-borderCol text-indigo-600">
                                    <span>Годовая поддержка (+100,000 ₸)</span>
                                </label>
                            </div>

                            <div class="p-4 bg-slate-900/60 rounded-xl border border-borderCol flex justify-between items-center mt-4">
                                <span class="text-sm font-bold text-white">Итоговая стоимость:</span>
                                <span id="calc-result" class="text-xl font-bold text-emerald-400">0 ₸</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateCalcSettings() {
            state.calculatorSettings.basePriceSqm = Number(document.getElementById('calc-sqm-price').value) || 0;
            state.calculatorSettings.basePriceHour = Number(document.getElementById('calc-hour-price').value) || 0;
            saveData();
            calculatePrice();
        }

        function calculatePrice() {
            const area = Number(document.getElementById('calc-area')?.value) || 0;
            const hours = Number(document.getElementById('calc-hours')?.value) || 0;
            
            let total = (area * state.calculatorSettings.basePriceSqm) + (hours * state.calculatorSettings.basePriceHour);

            if (document.getElementById('opt-supervision')?.checked) total += 200000;
            if (document.getElementById('opt-support')?.checked) total += 100000;
            if (document.getElementById('opt-urgent')?.checked) total *= 1.25;

            const resEl = document.getElementById('calc-result');
            if (resEl) resEl.innerText = Math.round(total).toLocaleString() + ' ₸';
        }

        // --- ДОГОВОРЫ ---
        function renderContracts() {
            return `
                <div class="space-y-6">
                    <h2 class="text-lg font-bold text-white">Хранилище договоров</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        ${state.contracts.map(c => `
                            <div class="bg-cardBg border border-borderCol p-5 rounded-2xl">
                                <div class="font-bold text-white text-sm">${c.name}</div>
                                <div class="text-xs text-slate-400 mt-1">Клиент: ${c.client}</div>
                                <div class="text-[10px] text-slate-500 mt-3">Дата: ${c.date}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- МОДАЛЬНЫЕ ОКНА И ДЕЙСТВИЯ (С ЗАГРУЗКОЙ КАРТИНОК С ПК) ---
        function openClientModal() {
            const name = prompt('Имя клиента / компании:');
            if (!name) return;
            const phone = prompt('Телефон:', '+7 700 ...');
            const type = confirm('Корпоративный клиент? (ОК - Да, Отмена - Нет)') ? 'corporate' : 'individual';
            
            // Загрузка аватара с ПК
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    state.clients.push({ id: Date.now(), name, contact: name, phone: phone || '', type, avatar: event.target.result });
                    saveData(); renderContent();
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function deleteClient(id) {
            state.clients = state.clients.filter(c => c.id !== id);
            saveData(); renderContent();
        }

        function openTaskModal() {
            const title = prompt('Название задачи:');
            if (!title) return;
            const client = prompt('Имя клиента:');
            const deadline = prompt('Дедлайн (YYYY-MM-DD):', '2026-04-30');
            
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    state.tasks.push({ id: Date.now(), title, client: client || 'Общий', deadline: deadline || '2026-04-30', status: 'active', priority: 'Высокий', image: event.target.result });
                    saveData(); renderContent();
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function deleteTask(id) {
            state.tasks = state.tasks.filter(t => t.id !== id);
            saveData(); renderContent();
        }

        function openFinanceModal() {
            const title = prompt('Назначение платежа:');
            if (!title) return;
            const amount = prompt('Сумма в ₸:');
            if (!amount) return;
            state.finances.push({ id: Date.now(), title, amount: Number(amount), type: 'income', date: new Date().toISOString().split('T')[0] });
            saveData(); renderContent();
        }

        function deleteFinance(id) {
            state.finances = state.finances.filter(f => f.id !== id);
            saveData(); renderContent();
        }

        function openAddEventModal() {
            const title = prompt('Название события / дедлайна:');
            if (!title) return;
            const date = prompt('Дата (YYYY-MM-DD):', '2026-04-');
            if (!date) return;
            state.calendarEvents.push({ id: Date.now(), title, date, type: 'event' });
            saveData(); renderContent();
        }

        function deleteEvent(id) {
            state.calendarEvents = state.calendarEvents.filter(e => e.id !== id);
            saveData(); renderContent();
        }

        // Запуск
        renderContent();
    </script>
</body>
</html>
